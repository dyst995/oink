name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_BASE: /oink/
        run: npm run build

      - name: Sync static site for branch Pages
        run: |
          rm -rf docs assets
          mkdir docs
          cp -a web/dist/. docs/
          # Root copy: Pages source "master / (root)"
          cp -a web/dist/index.html web/dist/.nojekyll web/dist/favicon.svg web/dist/icons.svg .
          cp -a web/dist/assets .

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs index.html .nojekyll favicon.svg icons.svg assets
          if git diff --staged --quiet; then
            echo "published site unchanged"
          else
            git commit -m "Update GitHub Pages site [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
